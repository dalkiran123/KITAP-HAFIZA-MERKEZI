name: BOOK CENTER bot pilot
on:
  workflow_dispatch:
    inputs:
      confirm_live_write:
        description: 'Type YES to run one signed bot tick'
        required: true
        default: 'NO'
permissions:
  contents: read
concurrency:
  group: book-center-bot-hourly
  cancel-in-progress: false
jobs:
  pilot:
    if: ${{ inputs.confirm_live_write == 'YES' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/bot-pythonanywhere-integration
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s bot_server -p 'test_*.py' -v
      - name: Signed pilot tick
        env:
          BOOK_BOT_ENABLE_REMOTE_WRITE: 'true'
          BOOK_BOT_API_URL: https://b2bsocialtest.pythonanywhere.com/api/bots/state
          BOOK_BOT_API_SECRET: ${{ secrets.BOOK_BOT_API_SECRET }}
        run: python -m bot_server.client
