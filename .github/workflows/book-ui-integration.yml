name: Book UI integration tests
on:
  push:
    branches:
      - feature/book-ui-safe-sync-integration
  pull_request:
    paths:
      - 'multiuser/**'
      - 'tests/test_multiuser_http_contract.py'
      - 'index.html'
      - '.github/workflows/book-ui-integration.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run isolated WSGI HTTP contract tests
        env:
          PYTHONPATH: 'multiuser:.'
        run: python -m unittest discover -s tests -p 'test_multiuser_http_contract.py' -v
