name: BOOK CENTER PythonAnywhere connection check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  signed-read-only-check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      BOT_TICK_SECRET: ${{ secrets.BOT_TICK_SECRET }}
      BOT_API_URL: https://b2bsocialtest.pythonanywhere.com/api/bots/state
    steps:
      - name: Verify authenticated read-only bot endpoint
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, hmac, json, os, time, urllib.request
          from urllib.parse import urlsplit
          secret = os.environ.get("BOT_TICK_SECRET", "")
          url = os.environ["BOT_API_URL"]
          parts = urlsplit(url)
          if len(secret) < 32:
              raise SystemExit("BOT_TICK_SECRET missing or too short")
          if parts.scheme != "https" or parts.path != "/api/bots/state" or parts.query or parts.fragment:
              raise SystemExit("Unexpected endpoint")
          stamp = str(int(time.time()))
          sig = hmac.new(secret.encode(), (stamp + ".GET./api/bots/state").encode(), hashlib.sha256).hexdigest()
          req = urllib.request.Request(url, headers={"X-Bot-Timestamp": stamp, "X-Bot-Signature": sig}, method="GET")
          with urllib.request.urlopen(req, timeout=20) as response:
              if response.status != 200:
                  raise SystemExit("Authenticated endpoint did not return 200")
              data = json.load(response)
          bots = data.get("bots")
          if not isinstance(bots, dict):
              raise SystemExit("Invalid bot response")
          if bots and set(bots) != {f"bot-{i:02d}" for i in range(1, 11)}:
              raise SystemExit("Unexpected bot IDs")
          print("Signed PythonAnywhere GET succeeded; bot count:", len(bots))
          PY
