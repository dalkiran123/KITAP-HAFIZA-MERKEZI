name: Multi-user foundation tests
on:
  push:
    branches:
      - feature/multi-user-foundation-100
  pull_request:
    paths:
      - 'multiuser/**'
      - '.github/workflows/multiuser-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile Python
        run: python -m compileall -q multiuser
      - name: Run all unit tests
        working-directory: multiuser
        run: python -m unittest discover -v -p 'test_*.py'
