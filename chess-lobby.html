<style>*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:linear-gradient(150deg,#0d1c31,#203e5c);font-family:system-ui,-apple-system,sans-serif;color:#f6f8fc}.shell{max-width:680px;margin:auto;padding:24px 16px 70px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.mark{font-size:35px}.tag{font-size:12px;color:#b7cee2;letter-spacing:1.5px}h1{font-size:clamp(28px,7vw,42px);margin:10px 0}p{color:#c6d5e2;line-height:1.55}.card{background:#fff;color:#1b3050;border-radius:22px;padding:22px;margin-top:18px;box-shadow:0 16px 32px #0004}.card h2{margin:0 0 12px;font-size:20px}label{display:block;font-weight:650;margin:12px 0 7px}input{width:100%;padding:15px;border:2px solid #b5c7d8;border-radius:12px;font:inherit;font-size:17px}input:focus{outline:3px solid #b6dbf5;border-color:#2961a3}.button{display:block;width:100%;border:0;border-radius:13px;background:#2057a3;color:white;padding:15px;margin-top:14px;font-size:16px;font-weight:700;text-align:center;text-decoration:none;cursor:pointer}.button.secondary{background:#eaf1fa;color:#173d70}.button:disabled{opacity:.5}.muted{font-size:13px;color:#63758b}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#8496a7;margin-right:7px}.list{padding:12px;border:1px dashed #a9bbcc;border-radius:12px;background:#f6f9fd}.notice{font-size:13px;color:#5e7083}#welcome{display:none}#welcome.show{display:block}#join{display:none}#join.show{display:block}.lobby-player{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid #dbe4ee;font-weight:650}.lobby-player:last-child{border:0}.lobby-player small{font-weight:400;color:#6c7c8f}.mini-btn{margin-left:auto;border:0;border-radius:9px;padding:9px 11px;background:#2057a3;color:white;font-weight:700;cursor:pointer}.mini-btn:disabled{opacity:.5}.invite-box{padding:12px;margin:10px 0;border:1px solid #cfdaeb;border-radius:12px;background:#f6f9fd}.invite-box .button{display:inline-block;width:auto;margin:7px 6px 0 0;padding:9px 14px}.lobby-player{flex-wrap:wrap}.lobby-player .player-detail{flex:1;min-width:125px}.lobby-player .invite-actions{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-left:auto}.mini-btn.accept{background:#de8425}.mini-btn.reject{background:#7d8798}.lobby-player.pending{background:#fff4e3;border-radius:10px;padding:12px}.online-dot{width:10px;height:10px;border-radius:50%;background:#22a45b;flex:none}

/* V2.2: vivid, readable lobby with contextual actions */
body{background:radial-gradient(ellipse at 85% 8%,#245d83 0%,transparent 40%),linear-gradient(145deg,#0c233c,#173b57 70%,#12304c)}
.card{box-shadow:0 14px 32px #06162955;border:1px solid #ffffff44}
#onlinePlayers{background:#f0f7ff;border:1px solid #b6d1e7;border-radius:14px;padding:8px 13px}
.lobby-player{padding:12px 10px;border-radius:10px;transition:background .2s;gap:7px}
.lobby-player:nth-child(odd){background:#e8f2ff}
.lobby-player:nth-child(even){background:#f5f9ff}
.lobby-player.pending{background:#fff0d7;border:1px solid #eab45c}
.lobby-player strong{font-size:15px;color:#0c3154}

.mini-btn.accept{background:#eb8a1b;box-shadow:0 3px 0 #ad5706}
.mini-btn.reject{background:#8c98aa;box-shadow:0 3px 0 #606e7e}
.lobby-player .mini-btn[data-action=resume]{background:#168263;box-shadow:0 3px 0 #07543d}
.lobby-player .mini-btn[data-action=watch]{background:#7556b9;box-shadow:0 3px 0 #4d3488}

.offline-details{margin-top:12px;border:1px solid #b9cadb;border-radius:12px;background:#f7f9fd;padding:10px}.offline-details summary{cursor:pointer;font-weight:700;color:#405c79;padding:5px}.offline-details[open] summary{margin-bottom:8px}.last-seen{display:block;width:100%;margin-top:5px;color:#64748b;font-size:12px;font-weight:400}
.stats-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;margin-top:12px}.stat-btn{border:2px solid #d4e1ef;background:#f0f6fd;border-radius:12px;padding:12px 3px;cursor:pointer;color:#244566;min-width:0}.stat-btn strong{display:block;font-size:24px}.stat-btn span{font-size:11px;font-weight:700}.stat-btn.active{background:#d6eaff;border-color:#2870b4}.invitation-details{border:1px solid #f1c586;background:#fff6e9;border-radius:12px;margin-top:12px;padding:12px}.invitation-details summary{cursor:pointer;font-weight:750;color:#8a4b0b}.invite-entry{padding:10px 0;border-top:1px solid #f1d5b1}.invite-entry .mini-btn{margin:5px 5px 0 0}.filter-note{font-size:12px;color:#5c7087;margin:8px 0}
.shell{padding-top:12px}.top{min-height:24px;align-items:flex-start}.top .mark{font-size:23px}.top .tag{font-size:12px;letter-spacing:.6px}h1{font-size:clamp(25px,6vw,34px);margin:2px 0 7px}#welcome{padding:12px 17px;margin-top:9px;border-radius:15px}#welcome .row{gap:8px}#welcome h2{font-size:clamp(21px,5.4vw,28px);line-height:1.15;margin:0}#change{font-size:12px!important;padding:7px 9px!important;max-width:112px}#dashboard{margin-top:10px}

.welcome-actions{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end;align-items:center}.welcome-actions button{width:auto!important;margin:0!important;font-size:12px!important;padding:8px 10px!important;max-width:none!important}.welcome-actions #refreshLobby{background:#1767a9;color:#fff;border-color:#105388;box-shadow:0 3px 0 #0b3b66}

/* V3: restrained modern lobby, flat edges and soft elevation */
body{background:linear-gradient(160deg,#10253c 0%,#173751 100%)}
.card{border:1px solid rgba(218,228,238,.7);border-radius:18px;box-shadow:0 10px 28px rgba(5,19,36,.14)}

.stat-btn strong{font-size:clamp(23px,5vw,29px);line-height:1.1;font-weight:750;letter-spacing:-.7px}

.stat-btn[data-filter="watching"]{background:#e8f1fd;border-color:#cddff6;color:#285e9d}

.stat-btn.active{outline:none;border-width:2px;box-shadow:0 0 0 2px rgba(23,48,75,.12),0 5px 14px rgba(17,34,53,.12)}
.welcome-actions{display:flex;gap:7px;flex-wrap:nowrap}
.welcome-actions button,.welcome-actions #refreshLobby{border:1px solid #dbe4ef!important;border-radius:10px!important;background:#f1f5fa!important;color:#1c476f!important;box-shadow:none!important;font-size:11px!important;font-weight:650!important;padding:9px 10px!important;white-space:nowrap}
.welcome-actions #refreshLobby{background:#e9f2fb!important;border-color:#cfe1f2!important}
#onlinePlayers{border:1px solid #dce6f0;border-radius:12px;background:#f8fbff}
.list{border:1px solid #e2e8f0;background:#f8fafc;border-radius:13px}
@media(max-width:420px){#welcome .row{align-items:flex-start}#welcome h2{font-size:20px;min-width:0}.welcome-actions{flex-direction:column;align-items:stretch}.welcome-actions button{padding:7px 8px!important}.stats-grid{gap:7px}.stat-btn{min-height:75px}}

/* V3.1: graphite-silver page backdrop; keep cards and status colors intact */
html{background:#303741}
body{background:radial-gradient(ellipse at 85% 4%,rgba(185,196,209,.20),transparent 43%),linear-gradient(155deg,#454d58 0%,#353c46 48%,#252c35 100%);background-attachment:fixed}

<body><main class="shell"><div class="top"><div class="mark">♟️</div><span class="tag">V3.1</span></div><h1>ChessOnline</h1>
<section class="card" id="join"><h2>Oyuncu girişi</h2><label for="nickname">Oyuncu adın</label><input id="nickname" maxlength="24" autocomplete="nickname" placeholder="Örn. Numan" aria-describedby="nameHelp"><p id="nameHelp" class="muted">2–24 karakter. Bu ad bu cihazda saklanır; henüz sunucuda kayıtlı bir hesap değildir.</p><button class="button" id="saveName">Lobiye gir</button><p class="notice" id="error" role="alert"></p></section>
<section class="card" id="welcome"><div class="row"><h2 id="hello">Hoş geldin</h2><div class="welcome-actions"><button id="change" class="button secondary" type="button">İsmi değiştir</button><button id="refreshLobby" class="button secondary" type="button">↻ Sayfayı yenile</button></div></div></section><section class="card" id="dashboard"><button class="button" id="share" style="margin-top:0">🔗 Arkadaşına giriş bağlantısı gönder</button><p id="shareResult" class="notice" aria-live="polite"></p><details class="invitation-details" id="incomingDetails"><summary id="incomingSummary">Gelen davetler (0)</summary><div id="incomingList"></div></details><div class="stats-grid" id="statsGrid"><button class="stat-btn active" data-filter="all"><strong id="statOnline">0</strong><span>Çevrimiçi</span></button><button class="stat-btn" data-filter="playing"><strong id="statPlaying">0</strong><span>Maçta</span></button><button class="stat-btn" data-filter="watching"><strong id="statWatching">0</strong><span>İzliyor</span></button><button class="stat-btn" data-filter="idle"><strong id="statIdle">0</strong><span>Müsait</span></button></div></section>
<section class="card"><div class="row"><h2>Oyuncu lobisi</h2><span class="muted" id="serverStatus"><span class="dot"></span>Bağlanıyor</span></div><div class="list"><strong>Oyuncular ve davetler</strong><p class="muted" id="playerStatus">Oyuncular sorgulanıyor...</p><div id="onlinePlayers" aria-live="polite"></div><details class="offline-details" id="offlineDetails"><summary id="offlineSummary">Çevrimdışı oyuncular (0)</summary><div id="offlinePlayers"></div></details></div><p id="lobbyMessage" class="notice" role="status"></p></section><section class="card" style="padding:14px 22px"><details id="historyDetails"><summary style="cursor:pointer;font-weight:700">Geçmiş maçlar</summary><div id="inviteList"></div></details></section><div id="liveMatches" hidden></div></main>
<script>(function(){'use strict';const KEY='chess:playerName';const input=document.getElementById('nickname'),join=document.getElementById('join'),welcome=document.getElementById('welcome'),hello=document.getElementById('hello'),error=document.getElementById('error');function show(name){if(name){hello.textContent='Hoş geldin, '+name;join.classList.remove('show');welcome.classList.add('show')}else{welcome.classList.remove('show');join.classList.add('show')}}let name='';try{name=localStorage.getItem(KEY)||''}catch(e){}show(name);document.getElementById('saveName').onclick=function(){const v=input.value.trim().replace(/\s+/g,' ');if(v.length<2||v.length>24){error.textContent='Oyuncu adını 2–24 karakter olarak yaz.';return}try{localStorage.setItem(KEY,v)}catch(e){error.textContent='Bu tarayıcı adı kalıcı kaydedemedi. Yine de devam edebilirsin.'}show(v)};document.getElementById('refreshLobby').onclick=()=>location.reload();document.getElementById('change').onclick=function(){input.value=hello.textContent.replace(/^Hoş geldin, /,'');show('');input.focus()};const API='https://b2bsocialtest.pythonanywhere.com/api/chess/lobby';let navigatingToChess=false;window.addEventListener('pagehide',()=>{if(navigatingToChess)return;try{fetch(API+'/offline',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:lobbyToken}),keepalive:true}).catch(()=>{})}catch(e){}});const onlinePlayers=document.getElementById('onlinePlayers'),offlinePlayers=document.getElementById('offlinePlayers'),offlineSummary=document.getElementById('offlineSummary'),playerStatus=document.getElementById('playerStatus'),serverStatus=document.getElementById('serverStatus');let lobbyToken='';let ownId='';const lobbyMessage=document.getElementById("lobbyMessage"),inviteList=document.getElementById("inviteList");const liveMatches=document.getElementById('liveMatches');const knownInvites=new Set();let firstInvitePoll=true;let cachedPlayers=[];let cachedInvites=[];let cachedLiveMatches=[];let playerFilter='all';const incomingDetails=document.getElementById('incomingDetails'),incomingSummary=document.getElementById('incomingSummary'),incomingList=document.getElementById('incomingList');document.querySelectorAll('.stat-btn').forEach(b=>b.addEventListener('click',()=>{playerFilter=b.dataset.filter;document.querySelectorAll('.stat-btn').forEach(x=>x.classList.toggle('active',x===b));renderPlayerRows();document.getElementById('onlinePlayers').scrollIntoView({block:'nearest',behavior:'smooth'})}));let autoOpenedRoom=sessionStorage.getItem('chess:autoOpenedRoom')||'';try{lobbyToken=localStorage.getItem('chess:lobbyToken')||''}catch(e){}if(!/^[a-zA-Z0-9_-]{32,128}$/.test(lobbyToken)){const bytes=new Uint8Array(32);crypto.getRandomValues(bytes);lobbyToken=Array.from(bytes,x=>x.toString(16).padStart(2,'0')).join('');try{localStorage.setItem('chess:lobbyToken',lobbyToken)}catch(e){}}async function pollLobby(){let current='';try{current=localStorage.getItem(KEY)||''}catch(e){}if(!current&&welcome.classList.contains('show'))current=hello.textContent.replace(/^Hoş geldin, /,'');try{if(current){const h=await fetch(API+'/heartbeat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:current,token:lobbyToken}),cache:'no-store'});if(!h.ok)throw Error('heartbeat '+h.status)}const response=await fetch(API+'/players',{cache:'no-store'});if(!response.ok)throw Error('players '+response.status);const data=await response.json();const digest=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(lobbyToken));ownId=Array.from(new Uint8Array(digest),b=>b.toString(16).padStart(2,'0')).join('');serverStatus.textContent='● Sunucu bağlı';playerStatus.textContent=(data.count||0)+' çevrimiçi · '+(data.total??data.players?.length??0)+' kayıtlı oyuncu';cachedPlayers=(data.players||[]).map(p=>({...p,online:Number(p.last_seen)*1000>=Date.now()-120000}));playerStatus.textContent=cachedPlayers.filter(p=>p.online).length+' çevrimiçi · '+cachedPlayers.length+' kayıtlı oyuncu';renderPlayerRows();}catch(e){serverStatus.textContent='● Sunucu güncellemesi bekleniyor';playerStatus.textContent='Çevrimiçi liste henüz kullanılamıyor. Sunucu güncellemesi gerekiyor.';onlinePlayers.replaceChildren();offlinePlayers.replaceChildren()}}async function lobbyRequest(path,options={}){const response=await fetch(API+path,{...options,headers:{'Content-Type':'application/json','X-Chess-Token':lobbyToken},cache:'no-store'});const data=await response.json();if(!response.ok)throw Error(data.error||'Sunucu hatası');return data}function rememberMatch(room,token){localStorage.setItem('chess:'+room,token)}function goMatch(room,token){navigatingToChess=true;rememberMatch(room,token);const url=new URL('./games-v5.html',location.href);url.searchParams.set('room',room);const player=localStorage.getItem(KEY);if(player)url.searchParams.set('player',player);location.href=url.toString()}function renderPlayerRows(){
 const online=cachedPlayers.filter(p=>p.online);const playing=online.filter(p=>p.activity==='playing');const watching=online.filter(p=>p.activity==='watching');const idle=online.filter(p=>p.activity==='idle');
 document.getElementById('statOnline').textContent=online.length;document.getElementById('statPlaying').textContent=playing.length;document.getElementById('statWatching').textContent=watching.length;document.getElementById('statIdle').textContent=idle.length;
 onlinePlayers.replaceChildren();offlinePlayers.replaceChildren();const recentOffline=cachedPlayers.filter(p=>!p.online).sort((a,b)=>Number(b.last_seen||0)-Number(a.last_seen||0)).slice(0,5);const recentOfflineIds=new Set(recentOffline.map(p=>p.id));offlineSummary.textContent='Son 5 çevrimdışı oyuncu ('+recentOffline.length+')';
 const active=cachedInvites.filter(i=>i.status==='pending'&&i.expires_at*1000>Date.now());
 const pendingById=new Map();const ongoing=cachedInvites.filter(i=>i.status==='accepted'&&!i.finished);
 for(const inv of active)pendingById.set(inv.direction==='incoming'?inv.from_id:inv.to_id,inv);
 for(const p of cachedPlayers){
  if(!p.online&&!recentOfflineIds.has(p.id))continue;
  if(p.online&&playerFilter!=='all'&&p.activity!==playerFilter)continue;
  const item=document.createElement('div');item.className='lobby-player';
  const inv=pendingById.get(p.id);const match=ongoing.find(i=>i.from_id===p.id||i.to_id===p.id);const busy=ongoing.some(i=>i.from_id===p.id||i.to_id===p.id);const selfBusy=ongoing.some(i=>i.from_id===ownId||i.to_id===ownId);const live=cachedLiveMatches.find(m=>m.white_name===p.name||m.black_name===p.name);
  if(inv)item.classList.add('pending');
  const dot=document.createElement('span');dot.className='online-dot';dot.style.background=p.online?'#20a563':'#9aa5b3';
  const name=document.createElement('strong');const sameNameCount=cachedPlayers.filter(x=>x.name===p.name).length;const sameNameIndex=cachedPlayers.filter(x=>x.name===p.name).findIndex(x=>x.id===p.id)+1;name.textContent=p.name+(p.id===ownId?' (Sen)':sameNameCount>1?' ('+sameNameIndex+')':'');
  const detail=document.createElement('small');detail.className='player-detail';
  detail.style.cssText='color:#61718b;font-size:12px;margin-left:5px';
  detail.textContent=inv?(inv.direction==='incoming'?'Davetin yanıtını üst bölümden verebilirsin':'Davet gönderildi · yanıt bekleniyor'):match?((p.online?'':'Çevrimdışı · ')+(match.from_id===p.id?match.to_name:match.from_name)+' ile maçı sürüyor'):p.activity==='watching'?(p.online?(p.match+' maçını izliyor'):'Çevrimdışı'):p.activity==='playing'?(p.online?(p.opponent+' ile maçta'):'Çevrimdışı · Maçı sürüyor'):(p.online?'Boşta':'Çevrimdışı');
  item.append(dot,name,detail);
  const actions=document.createElement('span');actions.className='invite-actions';
  const makeButton=(label,cls,callback)=>{const b=document.createElement('button');b.className='mini-btn '+cls;b.textContent=label;b.dataset.action=label.includes('devam')?'resume':label==='İzle'?'watch':'other';b.onclick=async()=>{b.disabled=true;try{await callback()}catch(e){lobbyMessage.textContent=e.message;b.disabled=false}};actions.append(b)};
  if(inv&&inv.direction==='incoming'&&false){
   makeButton('Kabul et','accept',async()=>{const out=await lobbyRequest('/invites/'+encodeURIComponent(inv.id)+'/respond',{method:'POST',body:JSON.stringify({action:'accept'})});goMatch(out.room,out.token)});
   makeButton('Reddet','reject',async()=>{await lobbyRequest('/invites/'+encodeURIComponent(inv.id)+'/respond',{method:'POST',body:JSON.stringify({action:'reject'})});await pollInvites()});
  }else if(inv&&inv.direction==='outgoing'){
   const wait=document.createElement('small');wait.textContent='⏳ '+Math.max(0,Math.ceil((inv.expires_at*1000-Date.now())/60000))+' dk';actions.append(wait);
  }else if(match){const token=localStorage.getItem('chess:'+match.room);const selfInMatch=match.from_id===ownId||match.to_id===ownId;if(selfInMatch&&token){if(p.id===ownId){makeButton('Maça devam et','',async()=>goMatch(match.room,token))}}else if(live){makeButton('İzle','',async()=>watchRoom(live.room))}}else if(live){makeButton('İzle','',async()=>watchRoom(live.room))}else if(p.id!==ownId&&p.online&&p.activity==='idle'&&!busy&&!selfBusy){

function renderIncoming(){incomingList.replaceChildren();const incoming=cachedInvites.filter(i=>i.status==='pending'&&i.direction==='incoming'&&Number(i.expires_at)*1000>Date.now());incomingSummary.textContent='Gelen davetler ('+incoming.length+')';for(const inv of incoming){const entry=document.createElement('div');entry.className='invite-entry';const label=document.createElement('strong');label.textContent=(inv.from_name||'Oyuncu')+' seni maça davet ediyor';entry.append(label);for(const [action,title] of [['accept','Kabul et'],['reject','Reddet']]){const b=document.createElement('button');b.className='mini-btn '+(action==='accept'?'accept':'reject');b.textContent=title;b.onclick=async()=>{b.disabled=true;try{const out=await lobbyRequest('/invites/'+encodeURIComponent(inv.id)+'/respond',{method:'POST',body:JSON.stringify({action})});if(action==='accept')goMatch(out.room,out.token);else await pollInvites()}catch(e){lobbyMessage.textContent=e.message;b.disabled=false}};entry.append(b)}incomingList.append(entry)}}
async function pollInvites(){
 if(!welcome.classList.contains('show'))return;
 try{
  const data=await lobbyRequest('/invites');
  cachedInvites=data.invites||[];
  renderIncoming();renderPlayerRows();
  inviteList.replaceChildren();
  const completed=cachedInvites.filter(i=>i.status==='accepted'&&i.finished);const acceptedOutgoing=cachedInvites.find(i=>i.status==='accepted'&&!i.finished&&i.direction==='outgoing'&&localStorage.getItem('chess:'+i.room));if(acceptedOutgoing&&autoOpenedRoom!==acceptedOutgoing.room){autoOpenedRoom=acceptedOutgoing.room;sessionStorage.setItem('chess:autoOpenedRoom',autoOpenedRoom);goMatch(acceptedOutgoing.room,localStorage.getItem('chess:'+acceptedOutgoing.room));return}
  if(!completed.length){inviteList.textContent='Henüz tamamlanan maç yok.'}
  for(const inv of completed){
   const item=document.createElement('div');item.className='invite-box';
   const title=document.createElement('strong');title.textContent=inv.from_name+' - '+inv.to_name;
   const detail=document.createElement('p');detail.className='muted';detail.textContent=inv.finished?'Maç sona erdi':'Devam eden maç';
   const b=document.createElement('button');b.className='button';b.textContent=inv.finished?'Maç sonucunu gör':'Maça devam et';
   b.onclick=()=>{const token=localStorage.getItem('chess:'+inv.room);if(token)goMatch(inv.room,token);else lobbyMessage.textContent='Bu cihazda maç anahtarı yok.'};
   item.append(title,detail,b);inviteList.append(item);
   if(!inv.finished&&inv.direction==='outgoing'&&!firstInvitePoll&&!knownInvites.has(inv.id)){
    const token=localStorage.getItem('chess:'+inv.room);if(token){goMatch(inv.room,token);return}
   }
   knownInvites.add(inv.id);
  }
  firstInvitePoll=false;
 }catch(e){lobbyMessage.textContent='Davetler alınamadı: '+e.message}
}
