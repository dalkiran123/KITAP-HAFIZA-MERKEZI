<section class="card lobby-card"><div class="row"><h2>Oyuncu lobisi</h2><span class="muted" id="serverStatus"><span class="dot"></span>Bağlanıyor</span></div><div class="list"><strong class="players-heading">Oyuncular ve davetler</strong><p class="muted" id="playerStatus">Oyuncular sorgulanıyor...</p><div id="onlinePlayers" aria-live="polite"></div><details class="offline-details" id="offlineDetails"><summary id="offlineSummary">Çevrimdışı oyuncular (0)</summary><div id="offlinePlayers"></div></details></div><p id="lobbyMessage" class="notice" role="status"></p></section><section class="card" style="padding:14px 22px"><details id="historyDetails"><summary style="cursor:pointer;font-weight:700">Geçmiş maçlar</summary><div id="inviteList"></div></details></section><div id="liveMatches" hidden></div></main>
<script>(function(){'use strict';const KEY='chess:playerName';const input=document.getElementById('nickname'),join=document.getElementById('join'),welcome=document.getElementById('welcome'),hello=document.getElementById('hello'),error=document.getElementById('error');function show(name){if(name){hello.replaceChildren();const playerName=document.createElement('span');playerName.className='welcome-player-name';playerName.textContent=name;hello.append(playerName);join.classList.remove('show');welcome.classList.add('show')}else{welcome.classList.remove('show');join.classList.add('show')}}let name='';try{name=localStorage.getItem(KEY)||''}catch(e){}show(name);document.getElementById('saveName').onclick=function(){const v=input.value.trim().replace(/\s+/g,' ');if(v.length<2||v.length>24){error.textContent='Oyuncu adını 2–24 karakter olarak yaz.';return}try{localStorage.setItem(KEY,v)}catch(e){error.textContent='Bu tarayıcı adı kalıcı kaydedemedi. Yine de devam edebilirsin.'}show(v)};document.getElementById('refreshLobby').onclick=()=>location.reload();document.getElementById('change').onclick=function(){input.value=hello.textContent.replace(/^Hoş geldin, /,'');show('');input.focus()};const API='https://b2bsocialtest.pythonanywhere.com/api/chess/lobby';let navigatingToChess=false;window.addEventListener('pagehide',()=>{if(navigatingToChess)return;try{fetch(API+'/offline',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:lobbyToken}),keepalive:true}).catch(()=>{})}catch(e){}});const onlinePlayers=document.getElementById('onlinePlayers'),offlinePlayers=document.getElementById('offlinePlayers'),offlineSummary=document.getElementById('offlineSummary'),playerStatus=document.getElementById('playerStatus'),serverStatus=document.getElementById('serverStatus');let lobbyToken='';let ownId='';const lobbyMessage=document.getElementById("lobbyMessage"),inviteList=document.getElementById("inviteList");const liveMatches=document.getElementById('liveMatches');const knownInvites=new Set();let firstInvitePoll=true;let cachedPlayers=[];let cachedInvites=[];let cachedLiveMatches=[];let playerFilter='all';const incomingDetails=document.getElementById('incomingDetails'),incomingSummary=document.getElementById('incomingSummary'),incomingList=document.getElementById('incomingList');document.querySelectorAll('.stat-btn').forEach(b=>b.addEventListener('click',()=>{playerFilter=b.dataset.filter;document.querySelectorAll('.stat-btn').forEach(x=>x.classList.toggle('active',x===b));renderPlayerRows();document.getElementById('onlinePlayers').scrollIntoView({block:'nearest',behavior:'smooth'})}));let autoOpenedRoom=sessionStorage.getItem('chess:autoOpenedRoom')||'';try{lobbyToken=localStorage.getItem('chess:lobbyToken')||''}catch(e){}if(!/^[a-zA-Z0-9_-]{32,128}$/.test(lobbyToken)){const bytes=new Uint8Array(32);crypto.getRandomValues(bytes);lobbyToken=Array.from(bytes,x=>x.toString(16).padStart(2,'0')).join('');try{localStorage.setItem('chess:lobbyToken',lobbyToken)}catch(e){}}async function pollLobby(){let current='';try{current=localStorage.getItem(KEY)||''}catch(e){}if(!current&&welcome.classList.contains('show'))current=hello.textContent.replace(/^Hoş geldin, /,'');try{if(current){const h=await fetch(API+'/heartbeat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:current,token:lobbyToken}),cache:'no-store'});if(!h.ok)throw Error('heartbeat '+h.status)}const response=await fetch(API+'/players',{cache:'no-store'});if(!response.ok)throw Error('players '+response.status);const data=await response.json();const digest=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(lobbyToken));ownId=Array.from(new Uint8Array(digest),b=>b.toString(16).padStart(2,'0')).join('');serverStatus.textContent='● Sunucu bağlı';playerStatus.textContent=(data.count||0)+' çevrimiçi · '+(data.total??data.players?.length??0)+' kayıtlı oyuncu';cachedPlayers=(data.players||[]).map(p=>({...p,online:Number(p.last_seen)*1000>=Date.now()-120000}));playerStatus.textContent=cachedPlayers.filter(p=>p.online).length+' çevrimiçi · '+cachedPlayers.length+' kayıtlı oyuncu';renderPlayerRows();}catch(e){serverStatus.textContent='● Sunucu güncellemesi bekleniyor';playerStatus.textContent='Çevrimiçi liste henüz kullanılamıyor. Sunucu güncellemesi gerekiyor.';onlinePlayers.replaceChildren();offlinePlayers.replaceChildren()}}async function lobbyRequest(path,options={}){const response=await fetch(API+path,{...options,headers:{'Content-Type':'application/json','X-Chess-Token':lobbyToken},cache:'no-store'});const data=await response.json();if(!response.ok)throw Error(data.error||'Sunucu hatası');return data}function rememberMatch(room,token){localStorage.setItem('chess:'+room,token)}function goMatch(room,token){navigatingToChess=true;rememberMatch(room,token);const url=new URL('./games-v5.html',location.href);url.searchParams.set('room',room);const player=localStorage.getItem(KEY);if(player)url.searchParams.set('player',player);location.href=url.toString()}function renderPlayerRows(){
 const online=cachedPlayers.filter(p=>p.online);const playing=online.filter(p=>p.activity==='playing');const watching=online.filter(p=>p.activity==='watching');const idle=online.filter(p=>p.activity==='idle');
 document.getElementById('statOnline').textContent=online.length;document.getElementById('statPlaying').textContent=playing.length;document.getElementById('statWatching').textContent=watching.length;document.getElementById('statIdle').textContent=idle.length;
 onlinePlayers.replaceChildren();offlinePlayers.replaceChildren();const recentOffline=cachedPlayers.filter(p=>!p.online).sort((a,b)=>Number(b.last_seen||0)-Number(a.last_seen||0)).slice(0,5);const recentOfflineIds=new Set(recentOffline.map(p=>p.id));offlineSummary.textContent='Son 5 çevrimdışı oyuncu ('+recentOffline.length+')';
 const active=cachedInvites.filter(i=>i.status==='pending'&&i.expires_at*1000>Date.now());
 const pendingById=new Map();const ongoing=cachedInvites.filter(i=>i.status==='accepted'&&!i.finished);
 for(const inv of active)pendingById.set(inv.direction==='incoming'?inv.from_id:inv.to_id,inv);
 for(const p of cachedPlayers){
  if(!p.online&&!recentOfflineIds.has(p.id))continue;
  if(p.online&&playerFilter!=='all'&&p.activity!==playerFilter)continue;
  const item=document.createElement('div');item.className='lobby-player';
  const inv=pendingById.get(p.id);const match=ongoing.find(i=>i.from_id===p.id||i.to_id===p.id);const busy=ongoing.some(i=>i.from_id===p.id||i.to_id===p.id);const selfBusy=ongoing.some(i=>i.from_id===ownId||i.to_id===ownId);const live=cachedLiveMatches.find(m=>m.white_name===p.name||m.black_name===p.name);
  if(inv)item.classList.add('pending');
  const dot=document.createElement('span');dot.className='online-dot';dot.style.background=p.online?'#20a563':'#9aa5b3';
  const name=document.createElement('strong');const sameNameCount=cachedPlayers.filter(x=>x.name===p.name).length;const sameNameIndex=cachedPlayers.filter(x=>x.name===p.name).findIndex(x=>x.id===p.id)+1;name.textContent=p.name+(p.id===ownId?' (Sen)':sameNameCount>1?' ('+sameNameIndex+')':'');
  const detail=document.createElement('small');detail.className='player-detail';
  detail.style.cssText='color:#61718b;font-size:12px;margin-left:5px';
  detail.textContent=inv?(inv.direction==='incoming'?'Davetin yanıtını üst bölümden verebilirsin':'Davet gönderildi · yanıt bekleniyor'):match?((p.online?'':'Çevrimdışı · ')+(match.from_id===p.id?match.to_name:match.from_name)+' ile maçı sürüyor'):p.activity==='watching'?(p.online?(p.match+' maçını izliyor'):'Çevrimdışı'):p.activity==='playing'?(p.online?(p.opponent+' ile maçta'):'Çevrimdışı · Maçı sürüyor'):(p.online?'Boşta':'Çevrimdışı');
  item.append(dot,name,detail);
  const actions=document.createElement('span');actions.className='invite-actions';
  const makeButton=(label,cls,callback)=>{const b=document.createElement('button');b.className='mini-btn '+cls;b.textContent=label;b.dataset.action=label.includes('devam')?'resume':label==='İzle'?'watch':'other';b.onclick=async()=>{b.disabled=true;try{await callback()}catch(e){lobbyMessage.textContent=e.message;b.disabled=false}};actions.append(b)};
  if(inv&&inv.direction==='incoming'&&false){
   makeButton('Kabul et','accept',async()=>{const out=await lobbyRequest('/invites/'+encodeURIComponent(inv.id)+'/respond',{method:'POST',body:JSON.stringify({action:'accept'})});goMatch(out.room,out.token)});
   makeButton('Reddet','reject',async()=>{await lobbyRequest('/invites/'+encodeURIComponent(inv.id)+'/respond',{method:'POST',body:JSON.stringify({action:'reject'})});await pollInvites()});
  }else if(inv&&inv.direction==='outgoing'){
   const wait=document.createElement('small');wait.textContent='⏳ '+Math.max(0,Math.ceil((inv.expires_at*1000-Date.now())/60000))+' dk';actions.append(wait);
  }else if(match){const token=localStorage.getItem('chess:'+match.room);const selfInMatch=match.from_id===ownId||match.to_id===ownId;if(selfInMatch&&token){if(p.id===ownId){makeButton('Maça devam et','',async()=>goMatch(match.room,token))}}else if(live){makeButton('İzle','',async()=>watchRoom(live.room))}}else if(live){makeButton('İzle','',async()=>watchRoom(live.room))}else if(p.id!==ownId&&p.online&&p.activity==='idle'&&!busy&&!selfBusy){
   makeButton('Oyuna davet et','',async()=>{document.querySelectorAll('.time-chooser').forEach(e=>e.remove());const chooser=document.createElement('div');chooser.className='time-chooser';const title=document.createElement('strong');title.textContent=p.name+' için maç süresini seç';chooser.append(title);for(const [minutes,label] of [[10,'10 dk'],[30,'30 dk'],[60,'60 dk'],[0,'Süresiz']]){const choice=document.createElement('button');choice.type='button';choice.textContent=label;choice.onclick=async()=>{chooser.querySelectorAll('button').forEach(b=>b.disabled=true);try{const out=await lobbyRequest('/invite',{method:'POST',body:JSON.stringify({player_id:p.id,minutes})});rememberMatch(out.room,out.token);lobbyMessage.textContent=p.name+' oyuncusuna '+label+' maç daveti gönderildi.';chooser.remove();await pollInvites()}catch(e){lobbyMessage.textContent=e.message;chooser.querySelectorAll('button').forEach(b=>b.disabled=false)}};chooser.append(choice)}item.append(chooser)});
  }
  item.append(actions);if(!p.online){const last=document.createElement('small');last.className='last-seen';last.textContent='Son çevrimiçi: '+(Number.isFinite(Number(p.last_seen))&&Number(p.last_seen)>0?new Date(Number(p.last_seen)*1000).toLocaleString('tr-TR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}):'Bilinmiyor');detail.append(last);offlinePlayers.append(item)}else onlinePlayers.append(item);
 }

function renderIncoming(){incomingList.replaceChildren();const incoming=cachedInvites.filter(i=>i.status==='pending'&&i.direction==='incoming'&&Number(i.expires_at)*1000>Date.now());incomingSummary.textContent='Gelen davetler ('+incoming.length+')';for(const inv of incoming){const entry=document.createElement('div');entry.className='invite-entry';const label=document.createElement('strong');label.textContent=(inv.from_name||'Oyuncu')+' seni maça davet ediyor';entry.append(label);for(const [action,title] of [['accept','Kabul et'],['reject','Reddet']]){const b=document.createElement('button');b.className='mini-btn '+(action==='accept'?'accept':'reject');b.textContent=title;b.onclick=async()=>{b.disabled=true;try{const out=await lobbyRequest('/invites/'+encodeURIComponent(inv.id)+'/respond',{method:'POST',body:JSON.stringify({action})});if(action==='accept')goMatch(out.room,out.token);else await pollInvites()}catch(e){lobbyMessage.textContent=e.message;b.disabled=false}};entry.append(b)}incomingList.append(entry)}}
async function pollInvites(){
 if(!welcome.classList.contains('show'))return;
 try{
  const data=await lobbyRequest('/invites');
  cachedInvites=data.invites||[];
  renderIncoming();renderPlayerRows();
  inviteList.replaceChildren();
  const completed=cachedInvites.filter(i=>i.status==='accepted'&&i.finished);const acceptedOutgoing=cachedInvites.find(i=>i.status==='accepted'&&!i.finished&&i.direction==='outgoing'&&localStorage.getItem('chess:'+i.room));if(acceptedOutgoing&&autoOpenedRoom!==acceptedOutgoing.room){autoOpenedRoom=acceptedOutgoing.room;sessionStorage.setItem('chess:autoOpenedRoom',autoOpenedRoom);goMatch(acceptedOutgoing.room,localStorage.getItem('chess:'+acceptedOutgoing.room));return}
  if(!completed.length){inviteList.textContent='Henüz tamamlanan maç yok.'}
  for(const inv of completed){
   const item=document.createElement('div');item.className='invite-box';
   const title=document.createElement('strong');title.textContent=inv.from_name+' - '+inv.to_name;
   const detail=document.createElement('p');detail.className='muted';detail.textContent=inv.finished?'Maç sona erdi':'Devam eden maç';
   const b=document.createElement('button');b.className='button';b.textContent=inv.finished?'Maç sonucunu gör':'Maça devam et';
   b.onclick=()=>{const token=localStorage.getItem('chess:'+inv.room);if(token)goMatch(inv.room,token);else lobbyMessage.textContent='Bu cihazda maç anahtarı yok.'};
   item.append(title,detail,b);inviteList.append(item);
   if(!inv.finished&&inv.direction==='outgoing'&&!firstInvitePoll&&!knownInvites.has(inv.id)){
    const token=localStorage.getItem('chess:'+inv.room);if(token){goMatch(inv.room,token);return}
   }
   knownInvites.add(inv.id);
  }
  firstInvitePoll=false;
 }catch(e){lobbyMessage.textContent='Davetler alınamadı: '+e.message}
}
function watchRoom(room){navigatingToChess=true;const url=new URL('./chess-watch.html',location.href);url.searchParams.set('room',room);location.href=url.toString()}
async function pollLiveMatches(){
 try{
  const response=await fetch('https://b2bsocialtest.pythonanywhere.com/api/chess/live',{cache:'no-store'});
  const data=await response.json();if(!response.ok)throw Error(data.error||'Sunucu yanıt vermedi');
  cachedLiveMatches=data.matches||[];renderPlayerRows();
 }catch(e){lobbyMessage.textContent='Canlı maç listesi alınamadı: '+e.message}
}
pollLobby();pollLiveMatches();setTimeout(pollInvites,1200);setInterval(()=>{if(!document.hidden){pollLobby();pollInvites();pollLiveMatches()}},5000);document.addEventListener('visibilitychange',()=>{if(!document.hidden){pollLobby();pollInvites()}});document.getElementById('saveName').addEventListener('click',()=>{pollLobby();setTimeout(pollInvites,900)});document.getElementById('share').onclick=async function(){const url=location.origin+location.pathname;try{if(navigator.share)await navigator.share({title:'Satranç Merkezi',text:'Satranç Merkezi’ne katıl!',url});else if(navigator.clipboard){await navigator.clipboard.writeText(url);document.getElementById('shareResult').textContent='Giriş bağlantısı kopyalandı.'}else document.getElementById('shareResult').textContent=url}catch(e){if(e.name!=='AbortError')document.getElementById('shareResult').textContent=url}}})();</script></body></html>
