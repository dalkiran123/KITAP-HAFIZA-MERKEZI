<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#132943"><title>Canlı Maç İzle | Satranç Merkezi</title><style>
*{box-sizing:border-box}body{margin:0;background:#132943;color:#eaf2ff;font:16px system-ui,-apple-system,sans-serif}.wrap{max-width:850px;margin:auto;padding:16px}a{color:#b9d9ff}header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}h1{font-size:24px;margin:8px 0}.card{background:#fff;color:#182b45;border-radius:16px;padding:14px;margin:12px 0}.names{font-size:18px;font-weight:800;display:flex;justify-content:space-between;gap:12px}.clocks{display:flex;justify-content:space-between;gap:10px;margin:12px 0}.clock{flex:1;padding:10px;background:#e6ebf3;border-radius:10px;font-weight:750}.clock.active{background:#c9edc2;color:#194a24}.clock span{float:right;font-variant-numeric:tabular-nums}.board-wrap{max-width:650px;margin:auto}.board{display:grid;grid-template-columns:repeat(8,1fr);width:100%;aspect-ratio:1;border:5px solid #785a39;border-radius:7px;overflow:hidden}.sq{aspect-ratio:1}.sq{display:grid;place-items:center;font-family:Arial,'DejaVu Sans',sans-serif;font-size:clamp(27px,8.8vw,65px);line-height:1;font-weight:400;min-width:0;user-select:none}.sq.light{background:#f1ddb7}.sq.dark{background:#9b7652}.sq.last{box-shadow:inset 0 0 0 4px #e9d25c}.sq.white{color:#f9f9f9;-webkit-text-stroke:1.1px #454545;text-shadow:0 2px 2px #555}.sq.black{color:#3e3e40;-webkit-text-stroke:.5px #151515;text-shadow:0 2px 2px #888}.hint{font-size:13px;color:#53677d}.moves{display:flex;gap:8px;overflow-x:auto;padding:10px 0;white-space:nowrap}.move{background:#edf2f8;padding:7px;border-radius:7px;font-size:13px}.error{color:#9d2929}.pill{border-radius:50px;background:#254d81;padding:7px 11px;font-size:12px}button{padding:9px 14px;border:0;border-radius:9px;background:#245ca6;color:white;font-weight:700;cursor:pointer}@media(max-width:600px){.wrap{padding:8px}.card{padding:10px}.sq{font-size:clamp(25px,9vw,48px)}h1{font-size:20px}.clock{font-size:13px}}
.sq .piece-art{display:block;width:92%;height:92%;object-fit:contain;pointer-events:none}.sq{overflow:hidden}.result-banner{font-weight:900;font-size:clamp(20px,4vw,30px);background:#d5efc9;color:#164423;padding:12px;border:2px solid #58a047;border-radius:12px;text-align:center;margin:12px 0}
</style></head><body><main class="wrap"><header><a href="./chess-lobby.html?v=14">← Oyuncu lobisi</a><span class="pill">👁 SEYİRCİ MODU · V1.3</span></header><h1>Canlı Maç İzle</h1><section class="card"><div class="names"><span id="whiteName">Beyaz</span><span id="blackName">Siyah</span></div><div class="clocks"><div id="whiteClock" class="clock">⚪ Beyaz <span>--:--</span></div><div id="blackClock" class="clock">⚫ Siyah <span>--:--</span></div></div><div class="board-wrap"><div id="board" class="board" aria-label="Canlı satranç tahtası"></div></div><p id="status" class="hint">Maç yükleniyor...</p><div id="moves" class="moves" aria-label="Hamle geçmişi"></div><p class="hint">Yalnızca izleme. Hamle yapma, sohbet ve geri alma işlemleri seyircilere kapalıdır. Tahta yaklaşık 3 saniyede bir güncellenir.</p></section></main><script>
(()=>{'use strict';const API='https://b2bsocialtest.pythonanywhere.com/api/chess';const room=new URLSearchParams(location.search).get('room');const lobbyToken=localStorage.getItem('chess:lobbyToken')||'';const lobbyName=localStorage.getItem('chess:playerName')||'';const board=document.getElementById('board'),status=document.getElementById('status'),movesEl=document.getElementById('moves');const pieces={K:'♔',Q:'♕',R:'♖',B:'♗',N:'♘',P:'♙',k:'♚',q:'♛',r:'♜',b:'♝',n:'♞',p:'♟'};let lastUpdate=0;function draw(fen,moves){const ranks=fen.split(' ')[0].split('/');board.replaceChildren();let last=[];if(moves.length){const u=moves[moves.length-1];last=[u.slice(0,2),u.slice(2,4)]}for(let r=0;r<8;r++){let col=0;for(const ch of ranks[r]){if(/[1-8]/.test(ch)){for(let k=0;k<Number(ch);k++){add(r,col++,null)}}else add(r,col++,ch)}}function add(r,c,ch){const sq=document.createElement('div');const square='abcdefgh'[c]+(8-r);sq.className='sq '+((r+c)%2?'dark':'light')+(last.includes(square)?' last':'')+(ch?(ch===ch.toUpperCase()?' white':' black'):'');if(ch){const img=document.createElement('img');img.className='piece-art';img.alt=(ch===ch.toUpperCase()?'Beyaz ':'Siyah ')+ch.toUpperCase();img.src='https://images.chesscomfiles.com/chess-themes/pieces/neo/150/'+(ch===ch.toUpperCase()?'w':'b')+ch.toLowerCase()+'.png';img.onerror=()=>{const fallback=document.createElement('span');fallback.textContent=pieces[ch];img.replaceWith(fallback)};sq.append(img)}board.append(sq)}}function clock(ms){ms=Math.max(0,Math.floor(ms/1000));return String(Math.floor(ms/60)).padStart(2,'0')+':'+String(ms%60).padStart(2,'0')}async function refresh(){if(!room){status.textContent='Maç bağlantısı eksik.';return}try{const r=await fetch(API+'/watch/'+encodeURIComponent(room),{cache:'no-store'});const data=await r.json();if(!r.ok)throw Error(data.error||'Maç alınamadı');document.getElementById('whiteName').textContent='⚪ '+data.white_name;document.getElementById('blackName').textContent='⚫ '+data.black_name;draw(data.fen,data.moves||[]);movesEl.replaceChildren();(data.moves||[]).forEach((m,i)=>{const e=document.createElement('span');e.className='move';e.textContent=(Math.floor(i/2)+1)+(i%2?'...':'.')+' '+m;movesEl.append(e)});movesEl.scrollLeft=movesEl.scrollWidth;for(const color of ['white','black']){const e=document.getElementById(color+'Clock');e.querySelector('span').textContent=clock(data[color+'_ms']);e.classList.toggle('active',!data.finished&&data.turn===color)}status.textContent=data.finished?(data.result==='draw'?'MAÇ BİTTİ · BERABERE':'MAÇ BİTTİ! '+(data.result==='white'?data.white_name:data.black_name)+' KAZANDI!'):'Canlı · '+(data.turn==='white'?data.white_name:data.black_name)+' oynuyor';status.classList.toggle('result-banner',!!data.finished);lastUpdate=Date.now()}catch(e){status.textContent=e.message;status.className='hint error'}}async function spectatorPresence(){if(!room||!lobbyToken)return;try{await fetch(API+'/lobby/heartbeat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:lobbyName||'İzleyici',token:lobbyToken})});await fetch(API+'/lobby/watching',{method:'POST',headers:{'Content-Type':'application/json','X-Chess-Token':lobbyToken},body:JSON.stringify({room})})}catch(e){}}refresh();spectatorPresence();setInterval(()=>{if(!document.hidden)refresh()},3000);setInterval(()=>{if(!document.hidden)spectatorPresence()},12000)})();
</script></body></html>
