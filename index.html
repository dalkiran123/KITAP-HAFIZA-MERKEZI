<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111a30"><title>Kitap Hafıza Merkezi</title><style>*{box-sizing:border-box}body{margin:0;background:#0d1427;color:#edf3ff;font:16px system-ui,-apple-system,sans-serif}main{max-width:850px;margin:auto;padding:20px}h1{font-size:26px}h2{font-size:19px}p{line-height:1.7}.muted{color:#b6c5e0}.panel{background:#19243d;border:1px solid #354667;border-radius:16px;padding:18px;margin:14px 0}input,textarea,button,select{font:inherit;border-radius:10px;padding:12px}input,textarea,select{width:100%;background:#0c1529;color:white;border:1px solid #536787;margin:6px 0}textarea{min-height:180px}button{background:#47a9e9;color:#071426;border:0;font-weight:700;cursor:pointer;margin:5px 4px 5px 0}button.secondary{background:#344664;color:white}.book{border-bottom:1px solid #465673;padding:12px 0}.hidden{display:none}.stats{display:flex;gap:10px}.stats>div{flex:1;text-align:center;background:#263651;border-radius:12px;padding:12px}small{color:#b6c5e0}</style></head><body><main><h1>📚 Kitap Hafıza Merkezi</h1><p class="muted">Oku • Dinle • Hatırla</p><div class="stats"><div><strong id="total">0</strong><br><small>Kitap</small></div><div><strong id="finished">0</strong><br><small>Tamamlanan</small></div><div><strong id="percent">0%</strong><br><small>İlerleme</small></div></div><section class="panel"><h2>Kitap ekle</h2><input id="name" placeholder="Kitap adı"><input id="author" placeholder="Yazar"><textarea id="summary" placeholder="En fazla 10 paragraflık kitap özeti. ChatGPT'den aldığın özeti buraya yapıştır."></textarea><button id="add">Kitaplığa kaydet</button><p><small>Bu sürüm otomatik özet üretmez. Haftalık özetleri buraya kaydedebilirsin.</small></p></section><section class="panel"><h2>Kitaplığım</h2><div id="books"></div><button class="secondary" id="export">Yedek indir</button><label class="secondary" style="display:inline-block;padding:10px">Yedek yükle <input type="file" id="import" accept="application/json" style="max-width:200px"></label></section><section class="panel hidden" id="reader"><button class="secondary" id="back">← Kitaplığa dön</button><h2 id="rname"></h2><p class="muted" id="rauthor"></p><div><button id="play">▶ Dinle</button><button id="pause" class="secondary">⏸ Duraklat / Devam</button><button id="stop" class="secondary">■ Durdur</button><select id="rate" style="width:auto"><option value="0.8">0.8×</option><option value="1" selected>1×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option></select></div><article id="rsummary"></article><button id="complete">Tamamlandı olarak işaretle</button><button id="quiz" class="secondary">Hafıza testi hazırla</button></section><p class="muted"><small>Veriler bu tarayıcının yerel belleğinde tutulur. iPhone ve Android arasında otomatik eşitlenmez. Düzenli yedek al.</small></p></main><script>
const $=id=>document.getElementById(id),key='kitap-hafiza-v1',paras=s=>s.trim().split(/\n\s*\n/).filter(Boolean),esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));let books=[];try{books=JSON.parse(localStorage.getItem(key)||'[]');if(!Array.isArray(books))books=[]}catch(e){}let current=null,utter=null;function save(){try{localStorage.setItem(key,JSON.stringify(books))}catch(e){alert('Kaydetme başarısız. Depolama iznini kontrol et.')}render()}function render(){$('total').textContent=books.length;$('finished').textContent=books.filter(b=>b.done).length;$('percent').textContent=books.length?Math.round(100*books.filter(b=>b.done).length/books.length)+'%':'0%';$('books').innerHTML=books.length?'':'Henüz kitap yok.';books.forEach(b=>{const d=document.createElement('div');d.className='book';const title=document.createElement('strong');title.textContent=b.name+' • '+b.author;d.append(title,document.createElement('br'));const open=document.createElement('button');open.textContent='Oku / Dinle';open.onclick=()=>show(b.id);const del=document.createElement('button');del.className='secondary';del.textContent='Sil';del.onclick=()=>{if(confirm('Bu kitap silinsin mi?')){stop();books=books.filter(x=>x.id!==b.id);save();$('reader').classList.add('hidden')}};d.append(open,del);if(b.done)d.append(' ✓ Tamamlandı');$('books').append(d)})}function stop(){if('speechSynthesis'in window)window.speechSynthesis.cancel();utter=null}function show(id){stop();current=id;const b=books.find(x=>x.id===id);if(!b)return;$('reader').classList.remove('hidden');$('rname').textContent=b.name;$('rauthor').textContent=b.author;$('rsummary').innerHTML=paras(b.summary).map((p,i)=>'<p><strong>'+(i+1)+'.</strong> '+esc(p).replace(/\n/g,'<br>')+'</p>').join('');$('complete').textContent=b.done?'Tamamlandı ✓':'Tamamlandı olarak işaretle';$('reader').scrollIntoView({behavior:'smooth'})}$('add').onclick=()=>{let name=$('name').value.trim(),author=$('author').value.trim(),summary=$('summary').value.trim();if(!name||!author||!summary)return alert('Tüm alanları doldur.');if(paras(summary).length>10)return alert('Özet en fazla 10 paragraf olabilir.');books.unshift({id:String(Date.now())+Math.random(),name,author,summary,done:false});save();['name','author','summary'].forEach(id=>$(id).value='')};$('back').onclick=()=>{stop();$('reader').classList.add('hidden')};$('play').onclick=()=>{if(!('speechSynthesis'in window))return alert('Bu tarayıcı seslendirmeyi desteklemiyor.');const b=books.find(x=>x.id===current);if(!b)return;stop();utter=new SpeechSynthesisUtterance(b.name+'. '+b.author+'. '+b.summary);utter.lang='tr-TR';utter.rate=Number($('rate').value);const voices=speechSynthesis.getVoices();const tr=voices.find(v=>v.lang.toLowerCase().startsWith('tr'));if(tr)utter.voice=tr;speechSynthesis.speak(utter)};$('pause').onclick=()=>{if(!('speechSynthesis'in window))return;if(speechSynthesis.paused)speechSynthesis.resume();else speechSynthesis.pause()};$('stop').onclick=stop;$('complete').onclick=()=>{const b=books.find(x=>x.id===current);if(b){b.done=!b.done;save();show(b.id)}};$('quiz').onclick=()=>{const b=books.find(x=>x.id===current);if(!b)return;alert('Hafıza soruları: 1) Baş karakterler kim? 2) Başlangıçtaki sorun ne? 3) En önemli dönüm noktası ne? 4) Hikâye nasıl bitiyor? 5) Ana fikir ne?')};$('export').onclick=()=>{const blob=new Blob([JSON.stringify(books,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='kitap-hafiza-yedek.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};$('import').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const data=JSON.parse(await f.text());if(!Array.isArray(data)||!data.every(b=>typeof b.id==='string'&&typeof b.name==='string'&&typeof b.author==='string'&&typeof b.summary==='string'&&paras(b.summary).length<=10))throw Error('Geçersiz yedek');if(confirm('Mevcut kitaplık yedekle değiştirilsin mi?')){books=data;save()}}catch(err){alert(err.message)}e.target.value=''};window.addEventListener('beforeunload',stop);render();
</script></body></html>
