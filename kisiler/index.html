<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BOOK CENTER · Kişiler</title><style>body{margin:0;background:#dce9cb;color:#24364c;font:15px system-ui}main{max-width:720px;margin:auto;padding:16px}header,.panel{border-radius:20px;padding:18px;margin:12px 0;background:white;box-shadow:0 5px 18px #1b344322}header{background:linear-gradient(120deg,#302247,#5b4380);color:white}a{color:inherit}button,input{font:inherit;border-radius:11px;padding:10px;border:1px solid #aab7ca}button{background:#d6e5ff;color:#172e53;font-weight:700;cursor:pointer}button:disabled{opacity:.5}.tabs{display:flex;gap:7px;flex-wrap:wrap}.person{display:flex;align-items:center;gap:10px;border-bottom:1px solid #e1e6ec;padding:11px 0}.person button{margin-left:auto}.muted{color:#67788b;font-size:13px}.messages{max-height:260px;overflow:auto;background:#f0f4fa;padding:12px;border-radius:12px}.msg{padding:9px;margin:6px 0;background:white;border-radius:9px}.me{background:#d8ebff;text-align:right}input{width:65%;box-sizing:border-box}.notice{font-size:12px;color:#5b6876}h1{margin:0}h2{font-size:19px}</style></head><body><main><header><a href="../">← Ana Menü</a><h1>👥 Kişiler</h1><p>Okuma ligi · Arkadaşlar · Mesajlar</p><small>10 sanal profil. Yerel test sürümü</small></header><div class="panel"><div class="tabs"><button onclick="tab('league')">📊 Lig</button><button onclick="tab('friends')">🤝 Arkadaşlar</button><button onclick="tab('chat')">💬 Sohbet</button><button onclick="tab('studio')">✏️ Karakter</button></div><p class="notice">Sanal profiller gerçek insan değildir. Bu sürüm yalnızca cihazdaki kayıtları kullanır; arka planda kesintisiz sunucu simülasyonu henüz etkin değildir.</p></div><section id="content" class="panel"></section></main><script>
const KEY='bookcenter_people_v1', OLD='bookcenter_arena_botworld_v1';
const fallback=['Luna','Atlas','Mira','Deniz','Ada','Arda','Ece','Nova','Eren','Duru'];
const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function init(){let saved;try{saved=JSON.parse(localStorage.getItem(KEY))}catch{}if(saved?.bots?.length===10)return saved;let old;try{old=JSON.parse(localStorage.getItem(OLD))}catch{}const bots=Array.from({length:10},(_,i)=>{const b=old?.bots?.[i]||{};return{id:i,name:b.name||fallback[i],books:Math.max(0,Number(b.booksRead||b.completedBooks||0)),minutes:Math.max(0,Number(b.readingMinutes||0)),level:b.level||'Okur',friends:false,events:Array.isArray(b.events)?b.events.slice(0,20):[],messages:[]}});return{bots,selected:0,created:Date.now()}}
let state=init();let serverPeople=null;let activityEntries=null;let lifeEntries=null;let bookEntries=null;let relationEntries=null;let conversationEntries=null;let serverStatus='Yerel önizleme';let API_BASE='';function save(){localStorage.setItem(KEY,JSON.stringify(state))}
save();let view='league';
function tab(v){view=v;render()}
function friend(i){state.bots[i].friends=!state.bots[i].friends;save();render()}
function select(i){state.selected=i;view='chat';activityEntries=null;lifeEntries=null;bookEntries=null;relationEntries=null;conversationEntries=null;render();refreshActivity(i);refreshLife(i);refreshBooks(i);refreshRelations(i);refreshConversations(i)}
function rename(i){const v=prompt('Sanal kullanıcı adı',state.bots[i].name);if(v&&v.trim()){state.bots[i].name=v.trim().slice(0,35);save();render()}}
function send(){const el=document.getElementById('message'),v=el.value.trim();if(!v)return;const b=state.bots[state.selected];b.messages.push({me:true,text:v,at:Date.now()});const replies=['Bu kitabı neden önerdiğini merak ettim.','En sevdiğin yazar kim?','Ben de yeni kitaplar keşfetmek istiyorum.','Kitaplığındaki son kitabı nasıl buldun?'];b.messages.push({me:false,text:replies[b.messages.filter(x=>x.me).length%replies.length],at:Date.now()});save();render()}


function studioExport(){
 const characters=state.bots.map((b,i)=>({id:i+1,name:b.name,occupation:b.persona?.occupation||'',background:b.persona?.background||'',interests:b.persona?.interests||[]}));
 const blob=new Blob([JSON.stringify({characters},null,2)],{type:'application/json;charset=utf-8'});
 const url=URL.createObjectURL(blob);
 const link=document.createElement('a');link.href=url;link.download='bookcenter-kurgusal-karakterler.json';
 document.body.appendChild(link);link.click();link.remove();
 setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function studioSave(){const b=state.bots[state.selected];b.name=document.getElementById('pname').value.trim().slice(0,35)||b.name;b.persona={occupation:document.getElementById('pjob').value.trim().slice(0,100),background:document.getElementById('pstory').value.trim().slice(0,500),interests:document.getElementById('pinterests').value.split(',').map(x=>x.trim()).filter(Boolean).slice(0,20)};save();render()}
function studioChange(i){state.selected=Number(i);render()}
function studioRender(){const b=state.bots[state.selected],p=b.persona||{};return '<h2>Karakter Stüdyosu</h2><p class="notice">Bilgiler yalnızca bu cihazda saklanır. Sunucuya aktarılmaz.</p><select onchange="studioChange(this.value)">'+state.bots.map((x,i)=>'<option value="'+i+'" '+(i===state.selected?'selected':'')+'>'+escapeHtml(x.name)+'</option>').join('')+'</select><p>Ad <input id="pname" maxlength="35" value="'+escapeHtml(b.name)+'"></p><p>Meslek <input id="pjob" maxlength="100" value="'+escapeHtml(p.occupation||'')+'"></p><p>İlgi alanları <input id="pinterests" maxlength="500" value="'+escapeHtml((p.interests||[]).join(', '))+'"></p><p>Yaşam hikâyesi <textarea id="pstory" maxlength="500" rows="4">'+escapeHtml(p.background||'')+'</textarea></p><button onclick="studioSave()">Bu cihazda kaydet</button> <button onclick="studioExport()">10 karakteri JSON olarak dışa aktar</button>'}
function render(){const root=document.getElementById('content');if(view==='studio'){root.innerHTML=studioRender();return}if(view==='league'){const bots=serverPeople||state.bots;const rows=bots.map((b,i)=>({...b,id:serverPeople?Number(b.id)-1:i})).sort((a,b)=>b.books-a.books||b.minutes-a.minutes);root.innerHTML='<h2>Okuma Ligi</h2><p class="notice">'+escapeHtml(serverStatus)+' · Gerçek kullanıcı istatistikleri henüz bağlanmadığı için kullanıcı sıralaması gösterilmiyor. Arena maç puanları kullanılmaz.</p>'+rows.map((b,i)=>'<div class="person"><strong>'+(i+1)+'.</strong><div><b>'+escapeHtml(b.name)+'</b><div class="muted">'+b.books+' kitap · '+Math.round(b.minutes/60*10)/10+' saat'+(b.human?' · Gerçek':' · Sanal')+'</div></div>'+(b.human?'':'<button onclick="select('+b.id+')">Profil</button>')+'</div>').join('');return}
if(view==='friends'){root.innerHTML='<h2>Kişiler ve arkadaşlık</h2>'+state.bots.map(b=>'<div class="person"><div><b>'+escapeHtml(b.name)+'</b><div class="muted">'+escapeHtml(b.level)+' · '+b.books+' kitap · Sanal</div></div><button onclick="friend('+b.id+')">'+(b.friends?'✓ Arkadaş':'İstek gönder')+'</button><button onclick="rename('+b.id+')">✎</button><button onclick="select('+b.id+')">Mesaj</button></div>').join('');return}
const b=state.bots[state.selected];const remote=serverPeople&&serverPeople.find(p=>Number(p.id)===state.selected+1);root.innerHTML='<h2>💬 '+escapeHtml(b.name)+'</h2><p class="muted">'+escapeHtml(remote?remote.level:b.level)+' · '+(remote?remote.books:b.books)+' kitap · '+Math.round((remote?remote.minutes:b.minutes)/60*10)/10+' saat · Sanal kullanıcı</p><button onclick="friend('+b.id+')">'+(b.friends?'✓ Arkadaş':'Arkadaşlık isteği gönder')+'</button><h3>Mesajlar</h3><div class="messages">'+(b.messages.length?b.messages.map(m=>'<div class="msg '+(m.me?'me':'')+'">'+escapeHtml(m.text)+'</div>').join(''):'<p class="muted">İlk mesajını gönder.</p>')+'</div><p><input id="message" placeholder="Mesaj yaz..." maxlength="500"> <button onclick="send()">Gönder</button></p><h3>📖 Kitaplık</h3><div class="messages">'+(bookEntries?bookEntries.map(x=>'<div class="msg">'+escapeHtml(x.title)+' · '+Number(x.minutes||0)+' dk simüle okuma</div>').join('')||'<p class="muted">Henüz kitap kaydı yok.</p>':'<p class="muted">Sunucu kitaplık verisi henüz bağlanmadı.</p>')+'</div><h3>🗨️ Botlar arası konuşmalar</h3><div class="messages">'+(conversationEntries?conversationEntries.map(x=>'<div class="msg">'+escapeHtml(x.day)+' · '+escapeHtml((state.bots[Number(x.sender_id)-1]||{}).name||'Sanal karakter')+': '+escapeHtml(x.text)+'</div>').join('')||'<p class="muted">Henüz konuşma yok.</p>':'<p class="muted">Sunucu konuşma verisi henüz bağlanmadı.</p>')+'</div><h3>🤝 Botlar arası ilişkiler</h3><div class="messages">'+(relationEntries?relationEntries.map(x=>'<div class="msg">'+escapeHtml((state.bots[Number(x.person_id)-1]||{}).name||'Sanal karakter')+' · '+escapeHtml(x.status)+' · Yakınlık: '+Number(x.closeness)+'/100</div>').join('')||'<p class="muted">Henüz kayıtlı ilişki yok.</p>':'<p class="muted">Sunucu ilişki verisi henüz bağlanmadı.</p>')+'</div><h3>🌿 Sanal yaşam günlüğü</h3><div class="messages">'+(lifeEntries?lifeEntries.map(x=>'<div class="msg">'+escapeHtml(x.day)+' · '+escapeHtml(x.description)+'</div>').join('')||'<p class="muted">Henüz yaşam olayı yok.</p>':'<p class="muted">Sunucu yaşam verisi henüz bağlanmadı.</p>')+'</div><p class="notice">Yaşam olayları kurgusal simülasyondur.</p><p class="notice">Yanıtlar şimdilik örnek kural tabanlıdır. Canlı yapay zekâ ve sunucu mesajlaşması değildir.</p>'}
async function refreshLeague(){if(!API_BASE)return;try{const url=API_BASE.endsWith('/')?API_BASE.slice(0,-1):API_BASE;const response=await fetch(url+'/api/people/league',{cache:'no-store'});if(!response.ok)throw Error('HTTP '+response.status);const data=await response.json();if(data.source!=='simulated'||!Array.isArray(data.people)||data.people.length!==10)throw Error('Geçersiz veri');serverPeople=data.people.map(p=>({id:Number(p.id),name:String(p.name),books:Math.max(0,Number(p.books)||0),minutes:Math.max(0,Number(p.minutes)||0),level:String(p.level||'Okur')}));serverStatus='Sunucu simülasyon verileri';render()}catch(e){serverPeople=null;serverStatus='Sunucuya ulaşılamadı. Yerel önizleme';render()}}
async function refreshActivity(index){if(!API_BASE)return;try{const base=API_BASE.endsWith('/')?API_BASE.slice(0,-1):API_BASE;const response=await fetch(base+'/api/people/activity?person_id='+encodeURIComponent(index+1),{cache:'no-store'});if(!response.ok)throw Error('HTTP '+response.status);const data=await response.json();if(!Array.isArray(data.activity))throw Error('Geçersiz etkinlik verisi');if(state.selected===index&&view==='chat'){activityEntries=data.activity;render()}}catch(e){activityEntries=null}}
async function refreshLife(index){if(!API_BASE)return;try{const response=await fetch(API_BASE+'/api/people/life?person_id='+encodeURIComponent(index+1),{cache:'no-store'});if(!response.ok)throw Error('HTTP '+response.status);const data=await response.json();if(!Array.isArray(data.events))throw Error('Geçersiz yaşam verisi');if(state.selected===index&&view==='chat'){lifeEntries=data.events;render()}}catch(e){lifeEntries=null}}
async function refreshBooks(index){if(!API_BASE)return;try{const response=await fetch(API_BASE+'/api/people/books?person_id='+encodeURIComponent(index+1),{cache:'no-store'});if(!response.ok)throw Error('HTTP '+response.status);const data=await response.json();if(!Array.isArray(data.books))throw Error('Geçersiz kitap verisi');if(state.selected===index&&view==='chat'){bookEntries=data.books;render()}}catch(e){bookEntries=null}}
async function refreshRelations(index){if(!API_BASE)return;try{const response=await fetch(API_BASE+'/api/people/relations?person_id='+encodeURIComponent(index+1),{cache:'no-store'});if(!response.ok)throw Error('HTTP '+response.status);const data=await response.json();if(!Array.isArray(data.relations))throw Error('Geçersiz ilişki verisi');if(state.selected===index&&view==='chat'){relationEntries=data.relations;render()}}catch(e){relationEntries=null}}
async function refreshConversations(index){if(!API_BASE)return;try{const response=await fetch(API_BASE+'/api/people/conversations?person_id='+encodeURIComponent(index+1),{cache:'no-store'});if(!response.ok)throw Error('HTTP '+response.status);const data=await response.json();if(!Array.isArray(data.messages))throw Error('Geçersiz konuşma verisi');if(state.selected===index&&view==='chat'){conversationEntries=data.messages;render()}}catch(e){conversationEntries=null}}
async function configureAPI(){try{const response=await fetch('./config.json',{cache:'no-store'});if(!response.ok)return;const config=await response.json();const candidate=String(config.apiBase||'').trim();if(!candidate)return;const url=new URL(candidate);if(url.protocol!=='https:')return;API_BASE=url.origin;await refreshLeague()}catch(e){/* Offline and unconfigured installations remain local previews. */}}
render();configureAPI();
</script></body></html>
